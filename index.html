<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ربات ساز روبیکا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a10;
    --bg-card:#0c131c;
    --bg-hover:#101a26;
    --border:#1a2635;
    --border-light:#233247;
    --text:#e8eef4;
    --muted:#7e92a8;
    --accent:#00e5a0;
    --accent-dark:#00b37d;
    --accent-glow:rgba(0,229,160,0.15);
    --danger:#ff4d6d;
    --warn:#ffb020;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  
  /* پس‌زمینه متحرک */
  body{
    font-family:'Vazirmatn',sans-serif;
    color:var(--text);
    background-color:var(--bg);
    min-height:100vh;
    display: flex;
    flex-direction: column;
    overflow-x:hidden;
    position: relative;
  }
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.8;
  }

  /* محتوای اصلی بالای پس‌زمینه */
  .app-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* آیکون‌های SVG */
  .svg-icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .svg-icon.sm { width: 16px; height: 16px; }

  /* هدر */
  .header{
    background:rgba(6,10,16,0.9);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  
  .brand .logo{
    width:44px;height:44px;border-radius:50%;object-fit:cover;
    border:1px solid var(--border-light);box-shadow:0 0 15px rgba(0,229,160,0.25);
    flex-shrink:0;background: #000;
  }
  
  .brand-text h1{font-size:15px;font-weight:900;letter-spacing:-0.5px;}
  .brand-text span{font-size:10px;color:var(--muted);font-weight:400;}
  
  /* دکمه منو (سه خط) */
  .menu-btn {
    background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center; cursor: pointer; transition: all 0.3s ease;
  }
  .menu-btn:hover { background: var(--bg-hover); border-color: var(--muted); }
  .menu-btn.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

  /* منوی کشویی */
  .dropdown-menu {
    position: absolute; top: 66px; left: 16px; right: 16px;
    background: rgba(12, 19, 28, 0.98); backdrop-filter: blur(20px);
    border: 1px solid var(--border-light); border-radius: 16px; padding: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 100;
    display: none; flex-direction: column; gap: 4px;
    transform-origin: top center;
  }
  .dropdown-menu.show { display: flex; animation: dropIn 0.25s ease forwards; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .menu-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 10px; color: var(--text); text-decoration: none;
    font-size: 13px; font-weight: 600; transition: background 0.2s; cursor: pointer;
  }
  .menu-item:hover { background: var(--bg-hover); }
  .menu-item .svg-icon { width: 22px; height: 22px; }
  .menu-item.divider { height: 1px; background: var(--border); margin: 6px 0; padding: 0; pointer-events: none; }

  /* محتوا */
  .wrap { max-width:1000px; margin:0 auto; padding:16px 12px; display:flex; flex-direction:column; gap:16px; width: 100%; }
  @media(min-width:860px){ .wrap{ display:grid; grid-template-columns: 1fr 1.2fr; padding:24px 20px; gap:20px; } }

  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:0 8px 24px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
  @media(min-width:860px){ .card{ padding:22px; } }

  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .card-title { font-size:14px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .card-title .svg-icon { color: var(--accent); }
  .badge { font-size:10px; padding:4px 10px; border-radius:20px; font-weight:700; background:var(--bg); border:1px solid var(--border-light); color:var(--muted); white-space:nowrap; }

  /* فرم */
  .field{margin-bottom:14px;}
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .field input,.field textarea{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:13px; outline:none; transition:border .2s, box-shadow .2s; }
  .field input:focus,.field textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
  .field input::placeholder,.field textarea::placeholder{color:#3d4d61;}
  
  /* تب‌ها */
  .tabs { display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:12px; margin-bottom:14px; border:1px solid var(--border); }
  .tab { flex:1; text-align:center; padding:9px 4px; border-radius:8px; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tab.active { background:var(--bg-card); color:var(--accent); box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .tab-content { display:none; }
  .tab-content.active { display:block; animation:fadeIn .3s ease; }
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* آپلود فایل */
  .dropzone { border:2px dashed var(--border-light); border-radius:12px; padding:24px 16px; text-align:center; cursor:pointer; transition:all .2s; background:var(--bg); position:relative; }
  .dropzone:hover,.dropzone.dragover { border-color:var(--accent); background:rgba(0,229,160,0.03); }
  .dropzone .svg-icon { width:32px; height:32px; color:var(--muted); margin-bottom:8px; }
  .dropzone .dz-t1{font-size:12px;font-weight:700;color:var(--text);}
  .dropzone .dz-t2{font-size:10px;color:var(--muted);margin-top:4px;}
  .dropzone input[type=file]{display:none;}
  
  .file-pill { display:none; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; background:rgba(0,229,160,0.08); border:1px solid rgba(0,229,160,0.25); margin-top:12px; }
  .file-pill.show{display:flex;}
  .file-pill .svg-icon { color: var(--accent); }
  .file-pill .fp-name{font-size:11px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-pill .fp-size{font-size:10px;color:var(--muted);}

  /* دکمه‌ها */
  .btn { border:none; cursor:pointer; font-family:inherit; font-size:12px; font-weight:800; padding:12px 16px; border-radius:10px; color:#060a10; background:linear-gradient(135deg, var(--accent), var(--accent-dark)); transition:all .2s ease; display:inline-flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 4px 12px var(--accent-glow); }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,229,160,0.25);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  .btn.ghost { background:var(--bg); color:var(--text); border:1px solid var(--border-light); box-shadow:none; }
  .btn.ghost:hover{background:var(--bg-hover);border-color:var(--muted);}
  .btn.full{width:100%;}
  .btn svg { stroke: currentColor; }

  /* نوار پیشرفت */
  .progress-container {
    display: none; margin-top: 16px; background: var(--bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); position: relative;
  }
  .progress-container.show { display: block; }
  .progress-bar {
    height: 6px; background: linear-gradient(90deg, var(--accent-dark), var(--accent)); width: 0%; border-radius: 10px; box-shadow: 0 0 10px var(--accent);
  }
  .progress-text {
    position: absolute; top: -20px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--accent); font-weight: 700;
  }
  .animating-progress { animation: fillProgress 3s linear forwards; }
  @keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }

  /* لیست ربات‌ها */
  .bot-list{display:flex;flex-direction:column;gap:10px;}
  .empty { text-align:center; padding:30px 16px; background:var(--bg); border-radius:12px; border:1px dashed var(--border-light); }
  .empty .svg-icon { width:36px; height:36px; color:var(--muted); opacity:0.4; margin-bottom:8px; }
  .empty .t1{font-size:13px;font-weight:700;}
  .empty .t2{font-size:11px;color:var(--muted);margin-top:4px;}

  .bot-item { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; align-items:center; gap:10px; transition:all .2s; }
  .bot-item:hover{ border-color:var(--border-light); background:var(--bg-hover); }
  .bot-avatar { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:rgba(0,229,160,0.08); border:1px solid rgba(0,229,160,0.2); flex-shrink:0; }
  .bot-avatar .svg-icon { width:18px; height:18px; color:var(--accent); }
  .bot-info{flex:1;min-width:0;}
  .bot-info .name{font-size:12px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bot-info .meta{font-size:10px;color:var(--muted);display:flex;gap:6px;align-items:center;}
  .status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .status-dot.on{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .status-dot.off{background:var(--muted);}
  .bot-actions{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card); color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:all .15s; }
  .icon-btn .svg-icon { width:16px; height:16px; }
  .icon-btn:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border-light);}
  .icon-btn.play:hover{color:var(--accent);border-color:var(--accent);}
  .icon-btn.stop:hover{color:var(--warn);border-color:var(--warn);}
  .icon-btn.edit:hover{color:#3b82f6;border-color:#3b82f6;}
  .icon-btn.del:hover{color:var(--danger);border-color:var(--danger);}

  /* فوتر */
  .footer {
    text-align: center;
    padding: 20px;
    margin-top: auto;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    position: relative;
    z-index: 1;
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
    transition: color 0.2s;
  }
  .footer a:hover {
    color: #fff;
    text-shadow: 0 0 8px var(--accent-glow);
  }

  /* مودال */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); z-index:100; display:none; align-items:center; justify-content:center; padding:16px; }
  .modal-overlay.show{display:flex;animation:fadeIn .2s ease;}
  .modal { background:var(--bg-card); border:1px solid var(--border-light); border-radius:16px; width:100%; max-width:650px; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-hd { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--bg); }
  .modal-hd h3{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .modal-hd button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;transition:color .2s;}
  .modal-hd button:hover{color:var(--danger);}
  .modal-body { flex:1; overflow:auto; padding:0; background:#05080c; }
  .modal-body pre { margin:0; padding:16px; font-family:monospace; font-size:11px; line-height:1.8; color:#a6e3c5; direction:ltr; text-align:left; white-space:pre-wrap; word-break:break-all; }

  /* توست */
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--bg-card); border:1px solid var(--border-light); border-radius:10px; padding:10px 16px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:8px; transition:transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index:200; box-shadow:0 10px 30px rgba(0,0,0,0.5); max-width:90vw; }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:rgba(0,229,160,0.4);color:var(--accent);}
  .toast.err{border-color:rgba(255,77,109,0.4);color:var(--danger);}
  .toast.warn{border-color:rgba(255,176,32,0.4);color:var(--warn);}
</style>
</head>
<body>

<!-- کانواس پس‌زمینه متحرک -->
<canvas id="bg-canvas"></canvas>

<div class="app-content">
  <!-- هدر -->
  <header class="header">
    <div class="brand">
      <img src="https://cdn.imgurl.ir/uploads/c18766_file_0000000088508211a0a1ddf45223f392.png" alt="لوگو" class="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2300e5a0\' stroke-width=\'2\'><rect x=\'3\' y=\'3\' width=\'18\' height=\'18\' rx=\'2\'/><path d=\'M9 9l3 3-3 3\'/></svg>'">
      <div class="brand-text">
        <h1>ربات ساز روبیکا</h1>
        <span>پنل مدیریت ربات‌ها</span>
      </div>
    </div>
    
    <button class="menu-btn" id="menuBtn" aria-label="منو">
      <svg class="svg-icon" id="menuIcon" viewBox="0 0 24 24">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <!-- منوی کشویی با آیکون‌های اختصاصی -->
  <div class="dropdown-menu" id="dropdownMenu">

        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-width="1.5"/>
        <path d="M8 12l3 3 5-5" stroke-width="2"/>
      </svg>
      کانال روبیکا
    </a>
    <a href="https://rubika.ir/Abolfazl_Kazemi_SFG" target="_blank" class="menu-item">
      <!-- آیکون هدفون اختصاصی -->
      <svg class="svg-icon" viewBox="0 0 24 24" stroke-width="2">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
      </svg>
      پشتیبانی
    </a>
    <a href="https://B2n.ir/Counter2Mod_ir" target="_blank" class="menu-item">
      <!-- آیکون وب‌سایت -->
      <svg class="svg-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>

    </a>

  <!-- محتوای اصلی -->
  <div class="wrap">

      <div class="card-header">

          <span id="formTitle">ساخت ربات جدید</span>

      <div class="field">
        <label>نام نمایشی ربات</label>

      <div class="tabs">

      <div class="tab-content active" id="tab-file">

  <!-- فوتر -->

<script>
/* ============================================================
   1. اسکریپت پس‌زمینه متحرک (Canvas) - ذرات بیشتر
   ============================================================ */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let w, h;

function resizeCanvas() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  initParticles();
}

function initParticles() {
  particles = [];
  // افزایش تعداد ذرات (تقریباً دو برابر)
  const count = Math.min(120, (w * h) / 8000); 
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4
    });
  }
}

function drawParticles() {
  ctx.clearRect(0, 0, w, h);
  
  // رنگ ذرات و خطوط
  ctx.fillStyle = 'rgba(0, 229, 160, 0.5)';
  ctx.strokeStyle = 'rgba(0, 229, 160, 0.12)';
  ctx.lineWidth = 0.6;

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > w) p.vx *= -1;
    if (p.y < 0 || p.y > h) p.vy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // رسم خطوط بین ذرات نزدیک
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 130) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawParticles);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawParticles();

/* ============================================================
   2. منطق پنل (منو، ربات‌ها، فرم)
   ============================================================ */
const STORAGE_KEY = 'rubika_pro_panel_v7';
let bots = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editId = null;
let currentFileContent = null;

const toastIcons = {
  ok: '<svg class="svg-icon sm" style="color:var(--accent)" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  err: '<svg class="svg-icon sm" style="color:var(--danger)" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  warn: '<svg class="svg-icon sm" style="color:var(--warn)" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
};

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(bots)); }
function toPersian(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts) {
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return 'همین الان';
  if (d < 3600) return toPersian(Math.floor(d/60)) + ' دقیقه پیش';
  if (d < 86400) return toPersian(Math.floor(d/3600)) + ' ساعت پیش';
  return toPersian(Math.floor(d/86400)) + ' روز پیش';
}

let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  document.getElementById('toastIcon').innerHTML = toastIcons[type] || toastIcons.ok;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* --- منوی همبرگری --- */
const menuBtn = document.getElementById('menuBtn');
const menuIcon = document.getElementById('menuIcon');
const dropdownMenu = document.getElementById('dropdownMenu');

const iconHamburger = '<line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>';
const iconClose = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';

menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = dropdownMenu.classList.contains('show');
  if (isOpen) {
    dropdownMenu.classList.remove('show');
    menuBtn.classList.remove('active');
    menuIcon.innerHTML = iconHamburger;
  } else {
    dropdownMenu.classList.add('show');
    menuBtn.classList.add('active');
    menuIcon.innerHTML = iconClose;
  }
});

document.addEventListener('click', (e) => {
  if (!menuBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
    dropdownMenu.classList.remove('show');
    menuBtn.classList.remove('active');
    menuIcon.innerHTML = iconHamburger;
  }
});

/* --- تب‌ها --- */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
  });
});

/* --- آپلود فایل --- */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filePill = document.getElementById('filePill');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) readFile(e.target.files[0]); });

function readFile(file) {
  if (!file.name.match(/\.(py|js)$/i)) return toast('فقط فایل .py یا .js مجاز است', 'err');
  if (file.size > 5 * 1024 * 1024) return toast('حجم فایل بیشتر از ۵ مگابایت است', 'err');
  const reader = new FileReader();
  reader.onload = (e) => {
    currentFileContent = e.target.result;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = (file.size/1024).toFixed(1) + ' KB';
    filePill.classList.add('show');
    toast('فایل بارگذاری شد', 'ok');
  };
  reader.readAsText(file);
}

/* --- آیکون‌های لیست --- */
const icons = {
  play: '<svg class="svg-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  stop: '<svg class="svg-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>',
  edit: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  view: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  del: '<svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  bot: '<svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="16" r="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  empty: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>'
};

/* --- رندر لیست --- */
function render() {
  const list = document.getElementById('botList');
  document.getElementById('botCount').textContent = toPersian(bots.length) + ' ربات';

  if (bots.length === 0) {
    list.innerHTML = `<div class="empty"><div>${icons.empty}</div><div class="t1">هنوز رباتی نساخته‌ای</div><div class="t2">از فرم بالا اولین رباتت رو بساز</div></div>`;
    return;
  }

  list.innerHTML = bots.map(b => `
    <div class="bot-item">
      <div class="bot-avatar">${icons.bot}</div>
      <div class="bot-info">
        <div class="name">${escapeHtml(b.name)}</div>
        <div class="meta">
          <span class="status-dot ${b.active ? 'on' : 'off'}"></span>
          <span>${b.active ? 'در حال اجرا' : 'متوقف'}</span>
          <span>•</span>
          <span>${timeAgo(b.createdAt)}</span>
        </div>
      </div>
      <div class="bot-actions">
        ${b.active
          ? `<button class="icon-btn stop" onclick="toggleBot('${b.id}')" title="توقف">${icons.stop}</button>`
          : `<button class="icon-btn play" onclick="toggleBot('${b.id}')" title="اجرا">${icons.play}</button>`}
        <button class="icon-btn edit" onclick="editBot('${b.id}')" title="ویرایش">${icons.edit}</button>
        <button class="icon-btn" onclick="viewBot('${b.id}')" title="مشاهده">${icons.view}</button>
        <button class="icon-btn del" onclick="delBot('${b.id}')" title="حذف">${icons.del}</button>
      </div>
    </div>
  `).join('');
}

/* --- عملیات ربات --- */
window.toggleBot = function(id) {
  const b = bots.find(x => x.id === id);
  if (!b) return;
  b.active = !b.active;
  save(); render();
  toast(b.active ? `ربات «${b.name}» اجرا شد` : `ربات «${b.name}» متوقف شد`, b.active ? 'ok' : 'warn');
}

window.delBot = function(id) {
  const b = bots.find(x => x.id === id);
  if (!b) return;
  if (!confirm(`ربات «${b.name}» حذف شود؟`)) return;
  bots = bots.filter(x => x.id !== id);
  save(); render();
  toast('ربات حذف شد', 'err');
}

window.viewBot = function(id) {
  const b = bots.find(x => x.id === id);
  if (!b) return;
  document.getElementById('modalTitle').textContent = b.name;
  document.getElementById('modalCode').textContent = b.source;
  document.getElementById('modalOverlay').classList.add('show');
}

window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });

window.editBot = function(id) {
  const b = bots.find(x => x.id === id);
  if (!b) return;
  editId = id;
  document.getElementById('botName').value = b.name;
  document.getElementById('botSource').value = b.source;
  document.getElementById('formTitle').textContent = 'ویرایش ربات';
  document.getElementById('editBadge').style.display = 'inline-block';
  document.getElementById('saveBtn').innerHTML = '<svg class="svg-icon sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> ذخیره تغییرات';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
  document.querySelector('[data-tab="manual"]').classList.add('active');
  document.getElementById('tab-manual').classList.add('active');
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
}

window.cancelEdit = function() {
  editId = null;
  document.getElementById('botName').value = '';
  document.getElementById('botSource').value = '';
  document.getElementById('fileName').textContent = '-';
  document.getElementById('fileSize').textContent = '-';
  document.getElementById('filePill').classList.remove('show');
  currentFileContent = null;
  document.getElementById('formTitle').textContent = 'ساخت ربات جدید';
  document.getElementById('editBadge').style.display = 'none';
  document.getElementById('saveBtn').innerHTML = '<svg class="svg-icon sm" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> ساخت و اجرا';
  document.getElementById('cancelBtn').style.display = 'none';
}

/* --- ذخیره ربات (با انیمیشن ۳ ثانیه‌ای) --- */
document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('botName').value.trim();
  const manualSource = document.getElementById('botSource').value.trim();
  const source = currentFileContent || manualSource;

  if (!name) return toast('نام ربات را وارد کن', 'err');
  if (!source || source.length < 5) return toast('کد سورس را وارد کن یا فایل بده', 'err');

  const btn = document.getElementById('saveBtn');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  btn.disabled = true;
  btn.innerHTML = '<svg class="svg-icon sm" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> در حال پردازش...';
  
  progressContainer.classList.add('show');
  progressBar.classList.remove('animating-progress');
  void progressBar.offsetWidth;
  progressBar.classList.add('animating-progress');
  
  progressText.textContent = 'در حال بررسی سورس...';
  setTimeout(() => { progressText.textContent = 'در حال اتصال به سرور...'; }, 1000);
  setTimeout(() => { progressText.textContent = 'ربات در حال روشن شدن است...'; }, 2000);

  setTimeout(() => {
    progressContainer.classList.remove('show');
    btn.disabled = false;

    if (editId) {
      const b = bots.find(x => x.id === editId);
      if (b) {
        b.name = name; b.source = source;
        save(); render(); toast('تغییرات ذخیره شد', 'ok'); cancelEdit();
      }
    } else {
      bots.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name, source, active: true, createdAt: Date.now()
      });
      save(); render(); toast(`ربات «${name}» با موفقیت ساخته شد`, 'ok'); cancelEdit();
    }
  }, 3000);
});

render();
</script>
</body>
